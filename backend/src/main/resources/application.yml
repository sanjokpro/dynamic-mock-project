spring:
  application:
    name: dynamic-mock-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.graphql.observation.GraphQlObservationAutoConfiguration
  
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/dynamicmock}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

graalvm:
  script:
    timeout-seconds: 5
    max-memory-mb: 128
    allowed-languages: js,python
    allow-host-access: false
    allow-io: false
    allow-create-process: false
    allow-create-thread: false
    allow-native-access: false

mock:
  route:
    base-path: /mock
    default-delay-ms: 0
    max-delay-ms: 30000

# gRPC configuration
grpc:
  default-port: 9090
  max-concurrent-calls: 100
  
# ISO8583 configuration (jPOS Q2 framework)
iso8583:
  default-port: 8583
  socket-timeout-ms: 30000
  q2:
    enabled: false                   # Use standalone by default; set true to enable Q2
    deploy-dir: deploy               # Directory for Q2 deployment XMLs
  
# GraphQL configuration  
graphql:
  path: /graphql
  graphiql:
    enabled: true
    path: /graphiql

logging:
  level:
    com.dynamicmock: DEBUG
    org.springframework.web: INFO
    org.jpos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  api:
    key: ${API_KEY:default-dev-key}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:local-dev-insecure-secret-must-be-changed-in-prod-minimum-32-chars}
    jwt-expiry-hours: ${APP_AUTH_JWT_EXPIRY_HOURS:8}
    allow-registration: ${APP_AUTH_ALLOW_REGISTRATION:false}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# White-label instance branding (Sprint 6) — single-tenant, instance-wide.
# Every value defaults to empty: only non-blank WHITE_LABEL_* variables override the
# branding stored via the admin UI. Platform defaults live in OrganizationConfig.createDefault().
white-label:
  product-name: ${WHITE_LABEL_PRODUCT_NAME:}
  org-name: ${WHITE_LABEL_ORG_NAME:}
  logo-url: ${WHITE_LABEL_LOGO_URL:}
  favicon-url: ${WHITE_LABEL_FAVICON_URL:}
  primary-color: ${WHITE_LABEL_PRIMARY_COLOR:}
  secondary-color: ${WHITE_LABEL_SECONDARY_COLOR:}
  footer-text: ${WHITE_LABEL_FOOTER_TEXT:}
