version: "3.9"

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      mock-server:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=demo
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/dynamicmock
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SERVER_PORT=8080
      - API_KEY=${API_KEY:-default-dev-key}
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      # ── Authentication ──────────────────────────────────────────────────────
      # REQUIRED in production: replace with a 32+ character random secret.
      - APP_AUTH_JWT_SECRET=${APP_AUTH_JWT_SECRET:-local-dev-insecure-secret-must-be-changed-in-prod-minimum-32-chars}
      - APP_AUTH_JWT_EXPIRY_HOURS=${APP_AUTH_JWT_EXPIRY_HOURS:-8}
      # Initial administrator credentials (used only when MongoDB has zero users).
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # Set to true to allow self-service user registration.
      - APP_AUTH_ALLOW_REGISTRATION=${APP_AUTH_ALLOW_REGISTRATION:-false}
      # CORS — space-separated origins allowed to call /api/**
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8583:8583" # ISO8583 default port
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # GraalVM boot + Mongo demo seeding can exceed the retry window;
      # without a grace period the container is flagged unhealthy and
      # nginx/frontend (which depend on service_healthy) never start.
      start_period: 90s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://mock-server:8080
      # Note: NEXT_PUBLIC_API_KEY is no longer required for the UI.
      # The frontend now authenticates via JWT Bearer token obtained from /api/auth/login.
      # The X-API-KEY header is retained as a fallback for headless/script integrations.
    depends_on:
      mock-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:
  redis_data:
