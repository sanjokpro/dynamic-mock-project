version: "3.9"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=demo
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/dynamicmock
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SERVER_PORT=8080
      - API_KEY=${API_KEY:-default-dev-key}
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev
    environment:
      # Inside the compose network 'localhost:8080' is the frontend container,
      # not the backend — the /api rewrite and SSR client must target the service.
      - BACKEND_URL=http://mock-server:8080
      - NEXT_PUBLIC_API_KEY=${API_KEY:-default-dev-key}
      # Next dev server does not proxy the SockJS /ws-traffic upgrade, but the
      # backend port is published — point the traffic console straight at it.
      # For LAN/UAT access set this to the host-reachable backend URL instead.
      - NEXT_PUBLIC_WS_URL=http://localhost:8080/ws-traffic
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - mock-server

volumes:
  mongo_data:
  redis_data:
